<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No connection &middot; Ice Factory</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f1f5f9; color: #0f172a;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: #fff; border-radius: 1rem; padding: 2rem; max-width: 28rem; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.1); }
    .mark { font-size: 3rem; color: #0f766e; }
    a { display: inline-block; margin-top: 1rem; background: #0f766e; color: #fff; text-decoration: none;
        padding: .75rem 1.5rem; border-radius: .5rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">&#10052;</div>
    <h1>No connection</h1>
    <p>This system needs the internet. Please check your connection and try again. Nothing you entered is lost — the system only works online.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
