{% extends "base.html" %}
{% block title %}Page not found (404){% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 text-center py-5">
    <div class="display-1">404</div>
    <h1 class="h4">This page does not exist.</h1>
    <p class="text-muted">The link may be wrong, or the record may have been deleted.</p>
    <a class="btn btn-brand" href="{% url 'home' %}">Go home</a>
  </div>
</div>
{% endblock %}
